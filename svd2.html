<font size="+2"><b>4ch コンポジット・ビデオ信号分配器「SVD-14」</b></font><br>
<br>
<a href="cg/svd2/SVD14_1.jpg"><img align=left src="cg/svd2/SVD14_1ss.jpg" border="2" width="240" height="180" hspace="20" alt="Image1"></a>
<p>修論で使用するパターン認識ボードには、ビデオカメラ等の映像を入力しますが、
この映像に施す前処理の前後を比較する目的で作った4chのビデオ信号分配器です。
回路はほとんど<a href="svd.html">「SVD-28M」</a>と同等で、ビデオアンプには
<a href="http://www.njr.co.jp/">新日本無線</a>のNJM2267を使用しました。
コネクタにBNCを使用しているのは、使用するモニタ側がBNCなので、接続を簡単にする
ためです。今回、画質や信号の精度はそれほど重要ではないので、中の配線は手を
抜いています。
</p>

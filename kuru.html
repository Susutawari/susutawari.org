<h2>無電源即売会会場用販売促進回転装置「くるるん」</h2>
<br>
<a href="cg/kuru/kuru1_b.jpg"><img align=left src="cg/kuru/kuru1_s.jpg" border="2" width="320" height="236" hspace="20" alt="Image1"></a>
<p><a href="http://www.pcemblem.com/" class="deadlink" title="リンク切れ（2026-10-23 確認）。ドメイン消滅。さくまひろし氏の移転先は検索で見つからず">さくまひろし</a>氏に頼まれて作った
看板を乗せるための回転台です。アクリル板をステッピングモータで回転させる
駆動部分と、鉛蓄電池と制御回路の入った電源部分に分かれています。
制御回路などには<a href="http://akizukidenshi.com/">秋月電子</a>
のキットを利用しています。</p>

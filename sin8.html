<h3>8bit-TTL汎用データ入力装置「SIN-8」</h3>
<a href="cg/sin8/sin8fb.jpg"><img align="left" src="cg/sin8/sin8fss.jpg" border="2" width="240" height="113" hspace="20" alt="Image1"></a>
<p>
ロジックのテストをするために作ったTTLレベル出力の汎用データスイッチです。独立した８つのスイッチ出力と、ロータリエンコーダによる0〜255dまでの8bit出力の計16bit出力が可能です。ロータリエンコーダのデコード、値設定用のカウンタに<a href="http://www.xilinx.co.jp/">Xilinx</a>のCPLD、XC9500シリーズを使用しました。今回はケースのコンソールパネルに少し凝って見ました。</p>

<h3>箱に入れただけスイッチング電源「POWERBOX-5V」</h3>
<a href="cg/pb5/pb5fb.jpg"><img align="left" src="cg/pb5/pb5fss.jpg" border="2" width="240" height="128" hspace="20" alt="Image1"></a>
<p>
名前の通り市販のスイッチング電源をケースに入れただけです。このスイッチング電源は昔大学の先生に頂いたもので、出力は5[V]6[A]です。またマザーツール社のデジタル直流電流計「MT-220C」をシリーズに入れてありますが、この電流計のレンジは最大2[A]であるため、電流計をバイパスした出力端子も備えています。</p>
<p align="right">ｂｙ すすたわり</p><br clear="all">

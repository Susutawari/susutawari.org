<strong>オープンフィールド型ラット行動学習実験装置「MOUSEC」</strong></font><br>
<br>
<a href="cg/mousec/mousec1b.jpg"><img align=left src="cg/mousec/mousec1s.jpg" border="2" width="320" height="225" hspace="20" alt="Image1"></a>
<p>
<a href="http://www.riken.go.jp/">理化学研究所</a> <a href="http://www.riken.go.jp/r-world/research/lab/nokagaku/brain/index.html">ブレインウェイグループ</a> 脳創生表現チームの宮崎博士の依頼で作った
ラットの行動学習実験装置です。オープンフィールド内の照明、給餌、給水、音刺激の
制御をするもので、ラットのフィールド内の位置取得や条件設定を行うPCと共に使用
します。制御部分には<a href="https://www.amd.com/ja/products/adaptive-socs-and-fpgas.html">AMD（旧 XILINX社）</a>のXCS10PC84を使用しました。</p>
<p align="right">ｂｙ すすたわり</p><br clear="all">

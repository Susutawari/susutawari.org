<font size="+2"><b>8ch コンポジット・ビデオ信号分配器「SVD-28M」</b></font><br>
<br>
<a href="cg/svd/vdivpreb.jpg"><img align=left src="cg/svd/vdivpres.jpg" border="2" width="320" height="180" hspace="20" vspace="20" alt="Image1"></a>
<p><a href="http://www.jcss.net/~waft/">WAFT</a>に頼まれて作った
8chのビデオ信号分配器です。入力が2chあり、前面のスイッチで切替えられる他、
VJなどを始める前に誤って映像が出力されないようにMUTEの機能もついています。
これらのスイッチには安価で恰好も良いトグルスイッチを使いましたが、出っぱりが
大きいく、破損しやすいためフィールドワーク用にはあまり向いていないかもしれません。ビデオアンプには<a href="http://www.njr.co.jp/">新日本無線</a>のNJM2267を、
スイッチにはNJM2244を使用しました。</p>
<p align="right">ｂｙ すすたわり</p><br clear="all"><br>
